name: Build and Publish Debian Package

on:
  push:
    branches:
      - main
    tags:
      - 'v*.*.*' # Triggers on version tags (e.g., v1.0.6)
  pull_request:
    branches:
      - main

jobs:
  build-armhf:
    name: Build for ARMHF (32-bit Raspberry Pi)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Build on ARMHF Emulator
        uses: uraimo/run-on-arch-action@v2
        with:
          arch: armv7 # Targets 32-bit ARM (armhf)
          distro: ubuntu22.04
          run: |
            set -ex
            export DEBIAN_FRONTEND=noninteractive
            
            echo "Installing dependencies..."
            apt-get update
            apt-get install -y gcc python3-dev python3-pip cython3 dpkg-dev fakeroot pkg-config dos2unix
            
            echo "Checking files present in the repository..."
            ls -la
            
            echo "Fixing script line endings..."
            dos2unix *.sh *.py || true
            
            echo "Making scripts executable..."
            chmod +x *.sh
            
            echo "Running build script..."
            if [ -f "build_deb.sh" ]; then
              ./build_deb.sh
            elif [ -f "create_deb.sh" ]; then
              ./create_deb.sh
            else
              echo "[-] Error: Neither build_deb.sh nor create_deb.sh was found!"
              exit 1
            fi

      - name: Upload Debian Package Artifact
        uses: actions/upload-artifact@v4
        with:
          name: wifibox-collector-armhf-deb
          path: "*.deb"
          retention-days: 7

  publish-release:
    name: Publish to GitHub Releases
    needs: build-armhf
    if: startsWith(github.ref, 'refs/tags/v') # Only run this job if a tag was pushed
    runs-on: ubuntu-latest
    permissions:
      contents: write # Required to create a release
    steps:
      - name: Download Build Artifact
        uses: actions/download-artifact@v4
        with:
          name: wifibox-collector-armhf-deb
          path: .

      - name: Create Release and Upload .deb
        uses: softprops/action-gh-release@v2
        with:
          files: "*.deb"
          generate_release_notes: true
